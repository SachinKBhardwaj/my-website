<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: #f4f4f9;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Fullscreen Lightbox Overlay */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .lightbox .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Welcome to Advika & Anvika's world</h1>
    <p>Click any photo to view it full size.</p>

    <!-- Photo Gallery Grid (12 Images) -->
    <div class="gallery">
        <div class="gallery-item"><img src="images/IMG_20260914_010254024_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260912_141006172_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260928_133558922_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260926_221403695_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260926_221400271_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260919_182946889_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260919_182940880_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260914_203510657_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260914_203502557_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260914_010301688_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260914_010302260_HDR.jpg" alt="Gallery Image"></div>
        <div class="gallery-item"><img src="images/IMG_20260914_010302713.jpg" alt="Gallery Image"></div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="close" id="closeBtn">&times;</span>
        <img id="lightboxImg" src="" alt="Expanded Image">
    </div>

    <script>
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');

        // Open Lightbox on Click
        galleryItems.forEach(img => {
            img.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = img.src;
            });
        });

        // Close Lightbox when clicking the X button
        closeBtn.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        // Close Lightbox when clicking anywhere on the dark overlay
        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                lightbox.style.display = 'none';
            }
        });
    </script>

</body>
</html>
