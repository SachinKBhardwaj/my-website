<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 10px;
            background-color: #f4f4f9;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }

        /* Swiper Container Styles */
        .swiper {
            width: 90%;
            max-width: 900px;
            height: 450px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            background: #000;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        /* Customizing Navigation Arrows */
        .swiper-button-next, .swiper-button-prev {
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 50%;
            width: 20px;
            height: 20px;
        }

        .swiper-pagination-bullet-active {
            background: #007aff;
        }

        /* Fullscreen Lightbox Overlay */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .lightbox .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website!</h1>
    <p>Use the arrows or drag/swipe to scroll through the photos. Click any photo to expand.</p>

    <!-- Swiper Image Scroller -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="images/IMG_20260914_010254024_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260912_141006172_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260928_133558922_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260926_221403695_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260926_221400271_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260919_182946889_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260919_182940880_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260914_203510657_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260914_203502557_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260914_010301688_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260914_010302260_HDR.jpg" alt="Slide Image"></div>
            <div class="swiper-slide"><img src="images/IMG_20260914_010302713.jpg" alt="Slide Image"></div>
        </div>
        
        <!-- Swiper Controls -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="close" id="closeBtn">&times;</span>
        <img id="lightboxImg" src="" alt="Expanded Image">
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // Initialize Swiper
        const swiper = new Swiper('.mySwiper', {
            loop: true,
            grabCursor: true,
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            keyboard: {
                enabled: true,
            },
        });

        // Lightbox Popup logic
        const slideImages = document.querySelectorAll('.swiper-slide img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');

        slideImages.forEach(img => {
            img.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = img.src;
            });
        });

        closeBtn.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                lightbox.style.display = 'none';
            }
        });
    </script>

</body>
</html>
