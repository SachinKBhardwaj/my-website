<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            background-color: #f4f4f9;
            margin: 0;
            user-select: none;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }

        /* Gallery Grid Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Fullscreen Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .lightbox-content {
            position: relative;
            max-width: 85%;
            max-height: 85%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease-out;
            cursor: grab;
        }

        .lightbox-img:active {
            cursor: grabbing;
        }

        /* Control Buttons */
        .nav-btn, .close-btn, .zoom-btn {
            position: absolute;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            z-index: 1010;
        }

        .nav-btn:hover, .close-btn:hover, .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .close-btn {
            top: 20px;
            right: 25px;
            font-size: 35px;
        }

        .prev-btn {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .next-btn {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Zoom Toolbar */
        .zoom-toolbar {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 15px;
            z-index: 1010;
        }

        .zoom-btn {
            position: relative;
            width: 45px;
            height: 45px;
            font-size: 22px;
        }
    </style>
</head>
